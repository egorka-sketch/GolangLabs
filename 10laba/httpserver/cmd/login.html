<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лаба 10 — вход</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
input, button { font-size: 16px; padding: 6px 10px; margin: 4px 0; }
pre { background: #f3f3f3; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<h2>Вход (сайт сервера, localhost:8080)</h2>
<p>После входа сервер ставит cookie <code>token</code> с JWT (HttpOnly). Браузер дальше отправляет её сам.</p>
<input id="login" placeholder="логин"><br>
<input id="password" type="password" placeholder="пароль"><br>
<button onclick="doLogin()">Войти</button>
<button onclick="loadUsers()">Показать пользователей</button>
<button onclick="doLogout()">Выйти</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
async function doLogin() {
  const r = await fetch('/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({login: login.value, password: password.value})
  });
  out.textContent = r.ok ? 'Вход выполнен, cookie установлена' : 'Ошибка: ' + await r.text();
}
async function loadUsers() {
  const r = await fetch('/users?limit=100');
  out.textContent = r.status + '\n' + JSON.stringify(await r.json(), null, 2);
}
async function doLogout() {
  const r = await fetch('/auth/logout', {method: 'POST'});
  out.textContent = 'Выход: ' + r.status;
}
</script>
</body>
</html>
